manifest:
  remotes:
    - name: IntergatedCircuits
      url-base: https://github.com/IntergatedCircuits
    - name: nxp-mcuxpresso
      url-base: https://github.com/nxp-mcuxpresso
  #group-filter:
  #  - +optional # mcux-soc-svd

  projects:
    - name: freertos-mcpp
      remote: IntergatedCircuits
      revision: 31e7c17d7d174d5901c5b0e53f999ea0540a30f3
      path: modules/lib/freertos-mcpp

    - name: mcuxsdk-manifests
      remote: nxp-mcuxpresso
      path: mcuxsdk/manifest_int
      revision: v26.06.00-LTS
      clone-depth: 1
      import:
        name-allowlist:
          - core
          - CMSIS
          - mcu-sdk-components
          - mcu-sdk-examples         # not only example projects but also board support packages
          - mcuxsdk-tool-data
          - mcux-soc-svd             # only needed for debugging
          - freertos-kernel          # integration into the SDK
          - freertos-kernel-upstream # the actual kernel sources
          - lwip
          - usb
          - mcux-devices-kinetis
          - mcux-devices-mcx
          # TODO: allow more device lines
