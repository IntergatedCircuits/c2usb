description: c2usb CDC NCM virtual Ethernet controller

compatible: "c2usb,cdc-ncm-ethernet"

include: base.yaml

properties:
  local-mac-address:
    type: uint8-array
    description: Specifies the MAC address assigned to the network device.

  remote-mac-address:
    type: uint8-array
    required: true
    description: Specifies the MAC address assigned to the USB host.

  function-name:
    type: string
    required: false
    description: Name of the CDC NCM function associated with this virtual Ethernet controller.
